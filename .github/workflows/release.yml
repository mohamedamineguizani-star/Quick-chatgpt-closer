name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/QuickChatGPTCloser-${TAG_NAME}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Quick ChatGPT Closer ${{ github.ref_name }}
          body: |
            ## Quick ChatGPT Closer ${{ github.ref_name }} 🚀

            ### What's New in this update:
            - **No Settings screen**: Tapping the corner trigger no longer opens Android Settings (Storage / Cache).
            - **Seamless Automatic Closing**: Instantly exits ChatGPT directly to your home screen.
            - **Automatic In-App Chat Deletion**: Clicks the conversation menu and confirms deletion automatically before dismissing.
            - **Process Termination**: Background processes are cleared on exit.

            ### Download & Install:
            - Download the `.apk` attached below and install it on your device.
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
